interface=${IFACE}
driver=nl80211
ssid=${SSID}
hw_mode=a
channel=${CHANNEL}

# 802.11n + 802.11ac + 802.11ax (Wi-Fi 6)
ieee80211n=1
ieee80211ac=1
ieee80211ax=1
wmm_enabled=1

# 80 MHz channel width
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=${VHT_CENTER_FREQ}

# Security
wpa=2
wpa_passphrase=${PASSPHRASE}
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ieee80211w=1
